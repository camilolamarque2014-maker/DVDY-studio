# Publica una versión nueva de DVDY Studio para Windows y Ubuntu.
#
# Se activa al subir una etiqueta vX.Y.Z (por ejemplo: git push origin v2.4.0).
# En cada sistema corre las pruebas, compila y prueba el programa con --selftest. Si los dos
# salen bien, crea el release en GitHub con el zip de Windows y el .deb de Ubuntu. Las notas
# salen de .github/release-notes.md: la primera línea («# Título») es el título del release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # compilar a mano (sin publicar) desde la pestaña Actions

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Verificar que la etiqueta coincide con APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = python -c "from dvdy.config import APP_VERSION; print(APP_VERSION)"
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con APP_VERSION ($v) en dvdy/config.py"
          }

      - name: Pruebas
        run: python -m unittest discover -s tests -t . -v

      - name: Compilar
        run: python build.py

      - name: Probar el .exe (--selftest)
        timeout-minutes: 10
        run: |
          $exe = Get-ChildItem "compilacion/dist/DVDY Studio/DVDY Studio.exe"
          $out = Join-Path $PWD "selftest"
          Start-Process -FilePath $exe.FullName -ArgumentList "--selftest", "`"$out`"" -Wait
          $report = Get-Content (Join-Path $out "selftest.txt") -Encoding utf8
          $report | Write-Output
          # Las descargas de YouTube pueden fallar desde los servidores de GitHub (verificación
          # anti-robots), así que solo se exige que el programa arranque con todo incluido.
          if (-not ($report | Select-String -SimpleMatch "frozen: True")) { throw "El .exe no arrancó bien" }
          if (-not ($report | Select-String -SimpleMatch "https solo con certifi: OK")) { throw "Falla HTTPS con certifi" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: compilacion/dist/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest/
          if-no-files-found: ignore

  linux:
    # 22.04: el .deb funciona en Ubuntu 22.04 o posterior (necesita glibc 2.35)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verificar que la etiqueta coincide con APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "from dvdy.config import APP_VERSION; print(APP_VERSION)")
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "La etiqueta ${{ github.ref_name }} no coincide con APP_VERSION ($v) en dvdy/config.py"; exit 1
          fi

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Compilar el .deb
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build.py

      - name: Instalar el .deb como lo haría un usuario
        run: |
          sudo apt-get update
          sudo apt-get install -y ./compilacion/dist/dvdy-studio_*_amd64.deb
          dpkg -s dvdy-studio | grep -E "^(Status|Version):"
          test -x /usr/bin/dvdy-studio
          desktop-file-validate /usr/share/applications/dvdy-studio.desktop || true

      - name: Probar el programa instalado (--selftest)
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dvdy-studio --selftest "$PWD/selftest" || true
          cat selftest/selftest.txt
          grep -q "frozen: True" selftest/selftest.txt
          grep -q "https solo con certifi: OK" selftest/selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: compilacion/dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: selftest/
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux}"
          path: paquetes
          merge-multiple: true

      - name: Publicar el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l paquetes
          title=$(head -n 1 .github/release-notes.md | sed -E 's/^#[[:space:]]*//')
          tail -n +2 .github/release-notes.md > notes.md
          # Un solo .zip: las versiones de Windows ya instaladas toman el primer .zip del release
          gh release create "${{ github.ref_name }}" paquetes/*.zip paquetes/*.deb \
            --title "$title" --notes-file notes.md --verify-tag
